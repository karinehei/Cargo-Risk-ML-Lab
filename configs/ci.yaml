# Cargo Risk ML Lab – CI smoke configuration
# Architecture/reproducibility check only. Metrics here are NOT frozen-v1.

project:
  name: cargo-risk-ml-lab
  disclaimer: >
    This project uses fully synthetic data and fictional review logic for
    educational demonstration. It does not represent any customs authority,
    real border processes, or operational risk-assessment systems.
    The label-generating rules are toys and must not be used for real decisions.

random_seed: 42

data:
  n_samples: 800
  split_strategy: stratified
  test_size: 0.2
  val_size: 0.1
  target_positive_rate: 0.11
  positive_rate_min: 0.08
  positive_rate_max: 0.15
  label_flip_rate: 0.025
  logit_noise_std: 0.65
  period_fractions: [0.45, 0.20, 0.20, 0.15]
  drift_start_period: 2
  train_periods: [0, 1]
  val_periods: [2]
  test_periods: [3]
  raw_path: .ci-work/data/raw/synthetic_shipments.csv
  processed_dir: .ci-work/data/processed
  validation_report_path: .ci-work/data/raw/validation_report.json
  target_column: requires_review
  id_column: shipment_id
  period_column: generation_period
  missing_rate_min: 0.005
  missing_rate_max: 0.08
  missing_rates:
    declaration_completeness_score: 0.025
    documentation_count: 0.02
    sender_history_length: 0.02
    route_rarity: 0.015
    declared_vs_estimated_value_deviation: 0.03

features:
  numeric:
    - declared_value_eur
    - shipment_weight_kg
    - value_to_weight_ratio
    - declaration_completeness_score
    - documentation_count
    - previous_discrepancies
    - sender_history_length
    - route_rarity
    - declared_vs_estimated_value_deviation
    - submission_hour
    - expedited_shipment
  categorical:
    - transport_mode
    - origin_region
    - destination_region
    - commodity_category
  derived:
    - log_declared_value
    - is_off_hours

model:
  algorithm: logreg
  class_weight: balanced
  threshold: 0.5

training:
  cv_folds: 2
  cv_scoring: average_precision
  selection_metric: pr_auc
  search_enabled: false
  calibration_enabled: false
  n_jobs: 1
  latency_repeats: 20
  threshold:
    objective: fbeta
    beta: 2.0
    min_precision: 0.20
    grid_size: 17
  candidates:
    - logreg
  search_grids:
    dummy: {}
    logreg: {}
  mlflow_experiment: cargo-risk-ml-lab-ci
  artifact_dir: .ci-work/artifacts

mlops:
  experiment_name: cargo-risk-ml-lab-ci
  champion_path: .ci-work/artifacts/mlops/champion.json
  sklearn_serialization_format: cloudpickle
  artifact_dir: .ci-work/artifacts/mlops
  roundtrip_rtol: 1.0e-7
  roundtrip_atol: 1.0e-10
  champion_policy:
    version: "1.0.0"
    min_validation_recall: 0.15
    min_validation_pr_auc: 0.05
    pr_auc_indifference: 0.005
    max_latency_p99_ms: 200.0
    require_roundtrip: true
    simplicity_order:
      - logreg

evaluation:
  metrics:
    - roc_auc
    - average_precision
    - f1
    - precision
    - recall
    - accuracy
    - brier_score
  plots_dir: .ci-work/artifacts/plots

explainability:
  max_samples: 40
  top_features: 8
  output_dir: .ci-work/artifacts/explanations
  permutation_repeats: 2
  subgroup_min_n: 15
  local_example_rows: 1
  reconstruction_atol: 1.0e-8

monitoring:
  policy_version: "1.1.0"
  min_warning_features: 2
  null_replications: 2
  null_seed_base: 92001
  drift_threshold: 0.15
  psi_bins: 10
  min_batch_size: 50
  scenario_batch_size: 80
  reference_seed: 42
  reference_sample_size: 200
  reference_dataset_path: .ci-work/data/processed/train.csv
  reference_sample_path: .ci-work/data/monitoring/reference_sample.csv
  reference_profile_path: .ci-work/artifacts/monitoring/reference_profile.json
  scenario_dir: .ci-work/data/monitoring
  report_dir: .ci-work/artifacts/monitoring
  mlflow_experiment: cargo-risk-monitoring-ci
  severity_thresholds:
    psi_warning: 0.10
    psi_critical: 0.25
    ks_warning: 0.10
    ks_critical: 0.20
    smd_warning: 0.20
    smd_critical: 0.50
    js_warning: 0.05
    js_critical: 0.15
    tv_warning: 0.10
    tv_critical: 0.25
    unseen_warning: 0.01
    unseen_critical: 0.05
    missing_delta_warning: 0.05
    missing_delta_critical: 0.15
    score_psi_warning: 0.10
    score_psi_critical: 0.25
    review_rate_delta_warning: 0.05
    review_rate_delta_critical: 0.08
  legacy_prediction_threshold: 0.525

api:
  model_path: .ci-work/artifacts/model.joblib
  pipeline_path: .ci-work/artifacts/preprocess_pipeline.joblib
  metadata_path: .ci-work/artifacts/model_metadata.json
  title: Cargo Risk ML Lab API
  version: "0.1.0"
  max_batch_size: 100
  max_request_bytes: 1048576

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
