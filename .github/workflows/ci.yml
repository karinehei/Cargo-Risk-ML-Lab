# CI for Cargo Risk ML Lab (educational / synthetic ML portfolio)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check src app scripts tests

      - name: Ruff lint
        run: ruff check src app scripts tests

      - name: Mypy
        run: mypy src app

      - name: Pytest
        run: pytest --cov=src --cov-report=term-missing

      - name: Smoke generate and MLflow init
        run: |
          python -m scripts.generate_data
          python -m scripts.init_mlflow
