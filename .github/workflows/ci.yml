# CI for Cargo Risk ML Lab (educational / synthetic ML portfolio)
# Third-party actions are pinned to commit SHAs. Comments record the upstream tag.
# Long steps live in .github/actions/ and scripts/ci/.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Quality checks and API smoke
        uses: ./.github/actions/ci-quality

      - name: Container build and health
        uses: ./.github/actions/ci-container

      - name: Upload safe reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports
          path: |
            coverage.xml
            junit.xml
            bandit-report.json
            pip-audit.json
            sbom.cdx.json
          if-no-files-found: warn
