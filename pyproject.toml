[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cargo-risk-ml-lab"
version = "0.1.0"
description = "Educational synthetic cargo risk ML portfolio project (not affiliated with any customs authority)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Cargo Risk ML Lab" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "mlflow>=3.0",
    "cloudpickle>=3.0",
    "shap>=0.46",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "streamlit>=1.37",
    "evidently>=0.4.40",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "joblib>=1.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
]
security = [
    "bandit>=1.7",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "cyclonedx-bom>=5.0",
    "pip-licenses>=5.0",
]
lock = [
    "pip-tools>=7.4",
]

[project.scripts]
cargo-generate-data = "scripts.generate_data:main"
cargo-validate-data = "scripts.validate_data:main"
cargo-train = "scripts.train_model:main"
cargo-evaluate = "scripts.evaluate_model:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]
"scripts/*" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
mypy_path = "."
packages = ["src", "app"]

[[tool.mypy.overrides]]
module = ["shap.*", "evidently.*", "xgboost.*", "streamlit.*", "mlflow.*", "skops.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/**/__pycache__/*",
]

[tool.coverage.report]
# Initial floor from the first measured suite (~70% line+branch on src/).
# Prevents material regression without claiming 90%+ coverage.
fail_under = 68
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
